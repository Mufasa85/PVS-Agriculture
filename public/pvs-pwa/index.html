<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>PVS</title>

    <!-- PWA -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#3b52c4" />

    <!-- Icônes -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="icons/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="icons/favicon-16x16.png"
    />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

    <!-- iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PVS" />

    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #f4f5fb;
        color: #1c1c28;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
        padding: 24px;
      }
      .card {
        background: #fff;
        border-radius: 16px;
        padding: 40px 28px;
        box-shadow: 0 8px 24px rgba(59, 82, 196, 0.12);
        max-width: 360px;
      }
      img {
        width: 96px;
        height: 96px;
        margin-bottom: 16px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 22px;
        color: #3b52c4;
      }
      p {
        margin: 0;
        color: #555;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="icons/icon-192x192.png" alt="Logo PVS" />
      <h1>PVS</h1>
      <p>Application prête à être installée sur votre appareil.</p>
    </div>

    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("sw.js").catch(console.error);
        });
      }
    </script>
  </body>
</html>
